# The in-container mihomo proxy SERVER (the "remote box" the subscription
# points at): one listener per protocol of the subscription fixture, all
# outbound direct. Same listener syntax as the interop suite's
# mihomo-server.yaml.tmpl (ground truth from the real binary), trimmed to
# the TLS-free set so the suite needs no certs.
mode: direct
log-level: info
external-controller: 127.0.0.1:39190

listeners:
  - name: ss-in
    type: shadowsocks
    listen: 127.0.0.1
    port: 39388
    cipher: aes-256-gcm
    password: sc-e2e-ss-psk-8f3a
    udp: true

  - name: vmess-in
    type: vmess
    listen: 127.0.0.1
    port: 39400
    users:
      - uuid: b831381d-6324-4d53-ad4f-8cda48b30811
        alterId: 0

  - name: vmess-ws-in
    type: vmess
    listen: 127.0.0.1
    port: 39401
    users:
      - uuid: b831381d-6324-4d53-ad4f-8cda48b30811
        alterId: 0
    ws-path: /ws

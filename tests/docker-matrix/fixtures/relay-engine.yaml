# The BIG relay engine: one instance per platform carries the outbound
# matrix (Pick selector), the group matrix, the full 26-type rule ladder
# (each row routed to its own r-* outbound so /connections chains name
# the rule that fired), the DNS matrix (nameserver-policy maps one probe
# domain per upstream), and the API battery. Ports are fixed.
#
# Rule-ladder probe map (all hermetic loopback):
#   NETWORK,udp      SOCKS UDP-ASSOCIATE -> udp echo :41890
#   IP-CIDR6         http://[::1]:41805/
#   DOMAIN           exact.test              (resolved by the oracle -> 127.0.0.1)
#   DOMAIN-SUFFIX    a.suff.test
#   DOMAIN-KEYWORD   xkeyw.test
#   DOMAIN-REGEX     re-abc.test
#   DOMAIN-WILDCARD  awild.test              (*wild.test)
#   RULE-SET         a.ruleset.test          (provider file)
#   IP-CIDR          127.0.0.99:41800
#   IP-SUFFIX        127.0.127.9:41800       (suffix 127.9)
#   GEOIP,CN         127.126.0.1:41800       (mmdb maps it to CN)
#   IP-ASN           127.0.128.5:41800       (asn-only mmdb range)
#   DST-PORT         127.0.0.2:41801
#   SRC-PORT         127.0.0.3:41802 from source port 45123
#   IN-PORT          via listener :42791
#   IN-NAME          via listener named-in :42795
#   PROCESS-PATH     curl -> 127.0.0.5:41804/slow.txt
#   UID,0            python3 (root) -> 127.0.0.5:41804/slow.txt
#   IN-TYPE,mixed    nobody python3 via mixed :42790 -> 127.0.0.3:41802
#   CLASH-MODE,rule  nobody python3 via http listener :42796 -> 127.0.0.4:41802
#   MATCH            terminal (verified via /rules)
mode: rule
log-level: info
mixed-port: 42790
socks-port: 42795
port: 42796
external-controller: 127.0.0.1:42990
ipv6: true

proxies:
  # --- the outbound relay matrix (all dial the real mihomo server) ---
  - {name: o-ss, type: ss, server: 127.0.0.1, port: 42388, cipher: aes-256-gcm, password: matrix-ss-psk-123456, udp: true}
  - {name: o-ss2022, type: ss, server: 127.0.0.1, port: 42389, cipher: 2022-blake3-aes-256-gcm, password: bWF0cml4LXNzMjAyMi1rZXktLS0zMi1ieXRlcy1vayE=, udp: true}
  - {name: o-vmess, type: vmess, server: 127.0.0.1, port: 42400, uuid: b831381d-6324-4d53-ad4f-8cda48b30811, alterId: 0, cipher: auto}
  - {name: o-vmess-ws, type: vmess, server: 127.0.0.1, port: 42401, uuid: b831381d-6324-4d53-ad4f-8cda48b30811, alterId: 0, cipher: auto, network: ws, ws-opts: {path: /ws}}
  - {name: o-vless, type: vless, server: 127.0.0.1, port: 42402, uuid: b831381d-6324-4d53-ad4f-8cda48b30811, tls: true, servername: tls.test, skip-cert-verify: true}
  - {name: o-vless-reality, type: vless, server: 127.0.0.1, port: 42412, uuid: b831381d-6324-4d53-ad4f-8cda48b30811,
     reality-opts: {public-key: pF3AsmPmCvPgtT6eIhqv5Et6nes_Gy9-IBFXSC_oNTY, short-id: "0123456789abcdef"}, servername: tls.test, client-fingerprint: chrome}
  - {name: o-trojan, type: trojan, server: 127.0.0.1, port: 42403, password: matrix-trojan-pw-123456, sni: tls.test, skip-cert-verify: true, udp: true}
  - {name: o-trojan-ws, type: trojan, server: 127.0.0.1, port: 42411, password: matrix-trojan-pw-123456, sni: tls.test, skip-cert-verify: true, network: ws, ws-opts: {path: /ws}}
  - {name: o-socks5, type: socks5, server: 127.0.0.1, port: 42409, udp: true}
  - {name: o-http, type: http, server: 127.0.0.1, port: 42410}
  - {name: o-hy2, type: hysteria2, server: 127.0.0.1, port: 42404, password: matrix-hy2-pw-123456, skip-cert-verify: true}
  - {name: o-tuic, type: tuic, server: 127.0.0.1, port: 42405, uuid: b831381d-6324-4d53-ad4f-8cda48b30811, password: matrix-tuic-pw-123456, alpn: [tuic], skip-cert-verify: true}
  - {name: o-wireguard, type: wireguard, private-key: CEPallHQzXQ2OIAxgB4M2Ng9lWH+Xhcwmwv5Pu54R2Q=, ip: 172.19.0.2,
     peers: [{server: 127.0.0.1, port: 42160, public-key: hSpZ638o2zcJ4RLj72HgeiXWzPlu8Xlxw0QXJeQ6Cyc=}]}
  - {name: o-snell4, type: snell, server: 127.0.0.1, port: 42407, psk: matrix-snell-psk-123456, version: 4}
  - {name: o-snell5, type: snell, server: 127.0.0.1, port: 42408, psk: matrix-snell-psk-123456, version: 5}
  - {name: o-anytls, type: anytls, server: 127.0.0.1, port: 42406, username: anytls-user, password: matrix-anytls-pw-123456, skip-cert-verify: true}
  - {name: o-jls, type: snell, server: 127.0.0.1, port: 43109, psk: matrix-snell-psk-123456, version: 4,
     plugin-opts: {mode: jls, username: alice, password: matrix-jls-pw-123456}}
  - {name: o-ss-wrongpw, type: ss, server: 127.0.0.1, port: 42388, cipher: aes-256-gcm, password: WRONG-password-999}
  - {name: o-dead, type: socks5, server: 127.0.0.1, port: 1}

  # --- outbound transport/auth variants ---
  # vmess over gRPC (gun) — TLS is mandatory for grpc (engine rule).
  # The engine's grpc client no longer blocks the dial on the gun
  # server's response HEADERS (they arrive only after the first DATA
  # frame); the rows relay end to end against mihomo's gun listeners.
  - {name: o-vmess-grpc, type: vmess, server: 127.0.0.1, port: 42420, uuid: b831381d-6324-4d53-ad4f-8cda48b30811, alterId: 0, cipher: auto,
     network: grpc, grpc-opts: {grpc-service-name: matsvc}, tls: true, servername: tls.test, skip-cert-verify: true}
  # vmess over httpupgrade (shares ws-opts for path/headers).
  - {name: o-vmess-hu, type: vmess, server: 127.0.0.1, port: 42421, uuid: b831381d-6324-4d53-ad4f-8cda48b30811, alterId: 0, cipher: auto,
     network: httpupgrade, ws-opts: {path: /hu}, tls: true, servername: tls.test, skip-cert-verify: true}
  # vless over websocket+TLS.
  - {name: o-vless-ws, type: vless, server: 127.0.0.1, port: 42427, uuid: b831381d-6324-4d53-ad4f-8cda48b30811,
     tls: true, servername: tls.test, skip-cert-verify: true, network: ws, ws-opts: {path: /ws}}
  # trojan over gRPC (gun) — same lazy-response-HEADERS grpc client.
  - {name: o-trojan-grpc, type: trojan, server: 127.0.0.1, port: 42422, password: matrix-trojan-pw-123456,
     sni: tls.test, skip-cert-verify: true, network: grpc, grpc-opts: {grpc-service-name: tjsvc}}
  # shadowsocks, chacha20-ietf-poly1305 AEAD cipher.
  - {name: o-ss-chacha, type: ss, server: 127.0.0.1, port: 42423, cipher: chacha20-ietf-poly1305, password: matrix-ss-psk-123456, udp: true}
  # hysteria2 with salamander obfs.
  - {name: o-hy2-obfs, type: hysteria2, server: 127.0.0.1, port: 42424, password: matrix-hy2-pw-123456,
     skip-cert-verify: true, obfs: salamander, obfs-password: matrix-obfs-pw-123}
  # socks5 with username/password auth.
  - {name: o-socks5-auth, type: socks5, server: 127.0.0.1, port: 42425, username: socksuser, password: sockspw123, udp: true}
  # http with basic auth.
  - {name: o-http-auth, type: http, server: 127.0.0.1, port: 42426, username: httpuser, password: httppw123}
  # wrong-credential negatives (mihomo refuses both — verified).
  - {name: o-socks5-wrongpw, type: socks5, server: 127.0.0.1, port: 42425, username: socksuser, password: WRONG-pw-999}
  - {name: o-http-wrongpw, type: http, server: 127.0.0.1, port: 42426, username: httpuser, password: WRONG-pw-999}
  # wireguard with an IPv6 tunnel address — the battery relays a v6
  # DESTINATION ([::1]:41805) through it against the wg6 endpoint it
  # starts itself (serve_endpoint, fd99:aa::/126).
  - {name: o-wireguard6, type: wireguard, private-key: +AarM977BRuq//eIUNC4d9AxRfZnmwghqQMv9ELTRHw=, ipv6: "fd99:aa::2",
     peers: [{server: 127.0.0.1, port: 42162, public-key: lwHQv9Be2TOT7fE/xSPtkqF7/ApO+eCZwNsWzCGA+T4=}]}

proxy-groups:
  # Pick carries every leaf, the auto groups AND the negatives so each
  # battery row genuinely switches the selector (set_selected rejects
  # non-members — a row that PUTs a non-member would silently relay
  # through the PREVIOUS selection and lie).
  - name: Pick
    type: select
    proxies: [o-ss, o-ss2022, o-vmess, o-vmess-ws, o-vless, o-vless-reality, o-trojan, o-trojan-ws, o-socks5, o-http, o-hy2, o-tuic, o-wireguard, o-snell4, o-snell5, o-anytls, o-jls,
              o-vmess-grpc, o-vmess-hu, o-vless-ws, o-trojan-grpc, o-ss-chacha, o-hy2-obfs, o-socks5-auth, o-http-auth, o-wireguard6,
              AutoUT, AutoFB, AutoLB, TolUT, StatusUT, LazyUT, NoUdp, HiddenUT, SubPick,
              o-ss-wrongpw, o-socks5-wrongpw, o-http-wrongpw, o-dead, DIRECT]
  - name: AutoUT
    type: url-test
    proxies: [o-ss, o-dead]
    url: http://127.0.0.1:41800/hello.txt
    interval: 60
    lazy: false
    expected-status: "200"
  - name: AutoFB
    type: fallback
    proxies: [o-dead, o-ss]
    url: http://127.0.0.1:41800/hello.txt
    interval: 60
  - name: AutoLB
    type: load-balance
    proxies: [o-ss, o-ss2022]
    strategy: consistent-hashing
  # ---- group-advanced rows () ----
  # tolerance: with a 60 s margin the incumbent (first live member,
  # o-vmess) can never be displaced — the group must NOT flap to o-ss
  # even when o-ss probes a hair faster.
  - name: TolUT
    type: url-test
    proxies: [o-vmess, o-ss]
    url: http://127.0.0.1:41800/hello.txt
    interval: 60
    tolerance: 60000
    lazy: false
    expected-status: "200"
  # expected-status: the health URL is the subscription server's 404
  # (missing path); only a probe that scores 404 as healthy keeps
  # o-http-auth alive — with the default 200-399 window both members
  # are dead and the group falls back to o-dead (relay fails). o-dead
  # first + a member in NO other url-test group (cross-group latency
  # recording) makes the distinction observable.
  - name: StatusUT
    type: url-test
    proxies: [o-dead, o-http-auth]
    url: http://127.0.0.1:41880/matrix-missing-404
    interval: 60
    lazy: false
    expected-status: "404"
  # lazy: untouched at startup — the API delay endpoint must still work
  # on it (the unit tests cover the probe-skip gate itself).
  - name: LazyUT
    type: url-test
    proxies: [o-ss, o-dead]
    url: http://127.0.0.1:41800/hello.txt
    interval: 60
    lazy: true
    expected-status: "200"
  # disable-udp (parsed since; enforced at relay time): the
  # DST-PORT,41891 rule below routes the battery's UDP probe DIRECTLY
  # through this flagged group — the relay must refuse the session —
  # while TCP through the same group (Pick -> NoUdp -> o-ss) still
  # relays. :41891 is the battery's SECOND udp echo (41890 stays with
  # the o-ss/trojan udp rows), so a missing refusal would genuinely
  # round-trip and fail the row.
  - name: NoUdp
    type: select
    proxies: [o-ss]
    disable-udp: true
  # hidden: honest probe — until the field lands GET /proxies keeps
  # listing the group; the row then reports the precise SKIP.
  - name: HiddenUT
    type: select
    proxies: [o-ss]
    hidden: true
  # provider member routing (): `use:` pulls matsub's fetched
  # nodes into the group after the inline members (DIRECT first — the
  # battery row PUTs matsub:sub-socks on SubPick before relaying, so a
  # DIRECT fallback can never fake a PASS).
  - name: SubPick
    type: select
    proxies: [DIRECT]
    use: [matsub]

# The provider rows (config-load fetch + registry/group `use:`
# wiring landed): matsub fetches from run.sh's plain subscription server
# (:41880), minfo from the battery's header-serving instance (:41881,
# adds the subscription-userinfo header for the userinfo row). The
# battery starts :41881 BEFORE any engine/test run touching this config
# — mihomo parity: providers fetch at startup (executor.go loadProvider
# → Initial()), so the server must be up first. Fetched members join
# the registry under `matsub:sub-socks`-style prefixed names.
#   `path` is absolute and under /tmp/matrix (writable): a relative path
#   would resolve against the read-only /matrix-fixtures mount once the
#   loader starts persisting fetched bodies.
proxy-providers:
  matsub:
    type: http
    url: http://127.0.0.1:41880/provider-clash.yaml
    path: /tmp/matrix/matsub-provider.yaml
    interval: 300
  minfo:
    type: http
    url: http://127.0.0.1:41881/provider-clash.yaml
    path: /tmp/matrix/minfo-provider.yaml
    interval: 300

rule-providers:
  pset:
    type: file
    behavior: domain
    format: text
    path: /tmp/matrix/ruleset-provider.txt

dns:
  enable: true
  listen: 127.0.0.1:42753
  enhanced-mode: fake-ip
  fake-ip-filter:
    - "+.*"
  default-nameserver:
    - 127.0.0.1:41553
  nameserver:
    - 127.0.0.1:41553
  nameserver-policy:
    "geoip-cn.test": 127.0.0.1:41553
    "tcp.test": tcp://127.0.0.1:41553
    "dot.test": tls://127.0.0.1:41853
    "doh.test": https://127.0.0.1:41443/dns-query
    "sys.test": system
    "nxd.test": rcode://name_error
    "ref.test": rcode://refused

rules:
  # The disable-udp probe lane: UDP to the battery's second echo
  # (:41891) routes DIRECTLY through the flagged NoUdp group, so the
  # relay-time refusal fires on the rule-selected outbound. Nothing
  # else targets :41891.
  - DST-PORT,41891,NoUdp
  - MATCH,Pick

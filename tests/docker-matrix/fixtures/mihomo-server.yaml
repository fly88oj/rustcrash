# The REAL mihomo binary as the shared proxy SERVER for the outbound
# matrix (all three platform binaries dial it as clients). One listener
# per relay-tested protocol, fixed ports, everything outbound direct.
# Fake credentials throughout. Certs live at /tmp/matrix/certs.
#
# NOTE (mihomo listener grammar, v1.19.x): the vmess/vless/trojan
# LISTENERS have no `network:` key — the transport is selected by which
# field is set: `ws-path` serves websocket, `grpc-service-name` serves
# the gun (gRPC) handler (v1.19.13 listener/config/vmess.go: VmessServer
# {WsPath, GrpcServiceName}). vless-ws-over-TLS and trojan-grpc work the
# same way. The engine's httpupgrade CLIENT is wire-compatible with the
# ws listener (verified engine<->mihomo end to end).
mode: direct
log-level: debug
external-controller: 127.0.0.1:42390

listeners:
  - name: m-ss
    type: shadowsocks
    listen: 127.0.0.1
    port: 42388
    cipher: aes-256-gcm
    password: matrix-ss-psk-123456
    udp: true

  - name: m-ss2022
    type: shadowsocks
    listen: 127.0.0.1
    port: 42389
    cipher: 2022-blake3-aes-256-gcm
    password: bWF0cml4LXNzMjAyMi1rZXktLS0zMi1ieXRlcy1vayE=
    udp: true

  - name: m-vmess
    type: vmess
    listen: 127.0.0.1
    port: 42400
    users:
      - uuid: b831381d-6324-4d53-ad4f-8cda48b30811
        alterId: 0

  - name: m-vmess-ws
    type: vmess
    listen: 127.0.0.1
    port: 42401
    users:
      - uuid: b831381d-6324-4d53-ad4f-8cda48b30811
        alterId: 0
    ws-path: /ws

  - name: m-vless
    type: vless
    listen: 127.0.0.1
    port: 42402
    users:
      - uuid: b831381d-6324-4d53-ad4f-8cda48b30811
    certificate: /tmp/matrix/certs/server.crt
    private-key: /tmp/matrix/certs/server.key

  - name: m-vless-reality
    type: vless
    listen: 127.0.0.1
    port: 42412
    users:
      - uuid: b831381d-6324-4d53-ad4f-8cda48b30811
    reality-config:
      dest: 127.0.0.1:41843
      private-key: IMr2zKQXw_IjvcdKV1jdnpR40GAJE-zfJRezmwJzAUs
      short-id:
        - "0123456789abcdef"
      server-names:
        - tls.test

  - name: m-trojan
    type: trojan
    listen: 127.0.0.1
    port: 42403
    udp: true
    users:
      - username: trojan-user
        password: matrix-trojan-pw-123456
    certificate: /tmp/matrix/certs/server.crt
    private-key: /tmp/matrix/certs/server.key

  - name: m-trojan-ws
    type: trojan
    listen: 127.0.0.1
    port: 42411
    network: ws
    ws-opts:
      path: /ws
    users:
      - username: trojan-user
        password: matrix-trojan-pw-123456
    certificate: /tmp/matrix/certs/server.crt
    private-key: /tmp/matrix/certs/server.key

  - name: m-hy2
    type: hysteria2
    listen: 127.0.0.1
    port: 42404
    users:
      hy2-user: matrix-hy2-pw-123456
    certificate: /tmp/matrix/certs/server.crt
    private-key: /tmp/matrix/certs/server.key

  - name: m-tuic
    type: tuic
    listen: 127.0.0.1
    port: 42405
    users:
      b831381d-6324-4d53-ad4f-8cda48b30811: matrix-tuic-pw-123456
    certificate: /tmp/matrix/certs/server.crt
    private-key: /tmp/matrix/certs/server.key
    alpn:
      - tuic
    congestion-controller: bbr
    max-idle-time: 15000

  - name: m-anytls
    type: anytls
    listen: 127.0.0.1
    port: 42406
    users:
      anytls-user: matrix-anytls-pw-123456
    certificate: /tmp/matrix/certs/server.crt
    private-key: /tmp/matrix/certs/server.key

  - name: m-snell4
    type: snell
    listen: 127.0.0.1
    port: 42407
    psk: matrix-snell-psk-123456
    version: 4

  - name: m-snell5
    type: snell
    listen: 127.0.0.1
    port: 42408
    psk: matrix-snell-psk-123456
    version: 5

  - name: m-socks
    type: socks
    listen: 127.0.0.1
    port: 42409
    udp: true

  - name: m-http
    type: http
    listen: 127.0.0.1
    port: 42410

  # ---- outbound-variant listeners () -------------------------

  # vmess over gRPC (gun): TLS + grpc-service-name selects the handler.
  - name: m-vmess-grpc
    type: vmess
    listen: 127.0.0.1
    port: 42420
    users:
      - uuid: b831381d-6324-4d53-ad4f-8cda48b30811
        alterId: 0
    grpc-service-name: matsvc
    certificate: /tmp/matrix/certs/server.crt
    private-key: /tmp/matrix/certs/server.key

  # engine-side httpupgrade transport target (mihomo's ws listener
  # accepts the raw-upgrade handshake; path via ws-path).
  - name: m-vmess-hu
    type: vmess
    listen: 127.0.0.1
    port: 42421
    users:
      - uuid: b831381d-6324-4d53-ad4f-8cda48b30811
        alterId: 0
    ws-path: /hu
    certificate: /tmp/matrix/certs/server.crt
    private-key: /tmp/matrix/certs/server.key

  # trojan over gRPC (gun).
  - name: m-trojan-grpc
    type: trojan
    listen: 127.0.0.1
    port: 42422
    grpc-service-name: tjsvc
    users:
      - username: trojan-user
        password: matrix-trojan-pw-123456
    certificate: /tmp/matrix/certs/server.crt
    private-key: /tmp/matrix/certs/server.key

  # vless over websocket+TLS.
  - name: m-vless-ws
    type: vless
    listen: 127.0.0.1
    port: 42427
    users:
      - uuid: b831381d-6324-4d53-ad4f-8cda48b30811
    ws-path: /ws
    certificate: /tmp/matrix/certs/server.crt
    private-key: /tmp/matrix/certs/server.key

  # shadowsocks with the chacha20-ietf-poly1305 AEAD cipher.
  - name: m-ss-chacha
    type: shadowsocks
    listen: 127.0.0.1
    port: 42423
    cipher: chacha20-ietf-poly1305
    password: matrix-ss-psk-123456
    udp: true

  # hysteria2 + salamander obfs.
  - name: m-hy2-obfs
    type: hysteria2
    listen: 127.0.0.1
    port: 42424
    users:
      hy2-user: matrix-hy2-pw-123456
    obfs: salamander
    obfs-password: matrix-obfs-pw-123
    certificate: /tmp/matrix/certs/server.crt
    private-key: /tmp/matrix/certs/server.key

  # socks5 with username/password auth (wrong-credential probes are
  # refused by mihomo — verified engine<->mihomo both directions).
  - name: m-socks-auth
    type: socks
    listen: 127.0.0.1
    port: 42425
    users:
      - username: socksuser
        password: sockspw123
    udp: true

  # http with basic auth.
  - name: m-http-auth
    type: http
    listen: 127.0.0.1
    port: 42426
    users:
      - username: httpuser
        password: httppw123

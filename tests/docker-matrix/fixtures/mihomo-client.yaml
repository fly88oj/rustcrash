# The REAL mihomo binary as the CLIENT for the inbound (listener)
# matrix: each platform's engine serves listeners, mihomo dials them.
# Node names carry the port they dial.
mode: rule
log-level: debug
mixed-port: 42500
external-controller: 127.0.0.1:42590

proxies:
  - name: m-ss
    type: ss
    server: 127.0.0.1
    port: 43101
    cipher: aes-256-gcm
    password: matrix-ss-psk-123456
    udp: true
  - name: m-vmess
    type: vmess
    server: 127.0.0.1
    port: 43102
    uuid: b831381d-6324-4d53-ad4f-8cda48b30811
    alterId: 0
    cipher: auto
  - name: m-vless
    type: vless
    server: 127.0.0.1
    port: 43103
    uuid: b831381d-6324-4d53-ad4f-8cda48b30811
    tls: true
    servername: tls.test
    skip-cert-verify: true
  - name: m-trojan
    type: trojan
    server: 127.0.0.1
    port: 43104
    password: matrix-trojan-pw-123456
    sni: tls.test
    skip-cert-verify: true
    udp: true
  - name: m-anytls
    type: anytls
    server: 127.0.0.1
    port: 43105
    username: anytls-user
    password: matrix-anytls-pw-123456
    skip-cert-verify: true
  - name: m-hy2
    type: hysteria2
    server: 127.0.0.1
    port: 43106
    password: matrix-hy2-pw-123456
    skip-cert-verify: true
  - name: m-tuic
    type: tuic
    server: 127.0.0.1
    port: 43107
    uuid: b831381d-6324-4d53-ad4f-8cda48b30811
    password: matrix-tuic-pw-123456
    alpn: [tuic]
    skip-cert-verify: true
  - name: m-snell4
    type: snell
    server: 127.0.0.1
    port: 43108
    psk: matrix-snell-psk-123456
    version: 4
  - name: m-snell5
    type: snell
    server: 127.0.0.1
    port: 43114
    psk: matrix-snell-psk-123456
    version: 5

proxy-groups:
  - name: Pick
    type: select
    proxies:
      - m-ss
      - m-vmess
      - m-vless
      - m-trojan
      - m-anytls
      - m-hy2
      - m-tuic
      - m-snell4
      - m-snell5

rules:
  - MATCH,Pick

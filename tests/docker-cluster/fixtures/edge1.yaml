# Edge role 1: the Rust engine, mihomo dialect. Dials the upstream mihomo
# by CONTAINER NAME ("server") — the docker embedded DNS resolves it.
mixed-port: 7890
allow-lan: true
mode: rule
log-level: debug
external-controller: 0.0.0.0:29090

dns:
  enable: true
  listen: 0.0.0.0:7892
  enhanced-mode: fake-ip
  nameserver:
    - udp://server:35353
  fake-ip-range: 198.18.0.1/15
  fake-ip-filter:
    - '*.lan'

proxies:
  - name: c-ss
    type: ss
    server: server
    port: 28388
    cipher: aes-256-gcm
    password: interop-ss-psk-123456
    udp: true

  - name: c-vmess-ws
    type: vmess
    server: server
    port: 28401
    uuid: b831381d-6324-4d53-ad4f-8cda48b30811
    alterId: 0
    cipher: auto
    network: ws
    ws-opts:
      path: /ws

  - name: c-trojan
    type: trojan
    server: server
    port: 28403
    password: interop-trojan-pw-123456
    sni: tls.cluster.test
    skip-cert-verify: true

proxy-groups:
  - name: Auto
    type: select
    proxies:
      - c-ss
      - c-vmess-ws
      - c-trojan

rules:
  - MATCH,Auto

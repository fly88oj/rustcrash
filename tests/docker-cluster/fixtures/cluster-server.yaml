# Upstream role: real mihomo binary serving every listener on 0.0.0.0 so
# other containers reach it across the bridge. Cluster subset of the
# interop fixture (ss / vmess-ws / trojan).
mode: direct
log-level: debug

listeners:
  - name: ss-in
    type: shadowsocks
    listen: 0.0.0.0
    port: 28388
    cipher: aes-256-gcm
    password: interop-ss-psk-123456
    udp: true

  - name: vmess-ws-in
    type: vmess
    listen: 0.0.0.0
    port: 28401
    users:
      - uuid: b831381d-6324-4d53-ad4f-8cda48b30811
        alterId: 0
    ws-path: /ws

  - name: trojan-in
    type: trojan
    listen: 0.0.0.0
    port: 28403
    users:
      - password: interop-trojan-pw-123456
    certificate: /fixtures/certs/server.crt
    private-key: /fixtures/certs/server.key

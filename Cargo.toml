[workspace]
resolver = "2"
members = [
    "core",
    "engine",
    "cmd/crash",
    "tests/integration",
]

[profile.release]
strip = true
lto = "thin"
opt-level = "z"
codegen-units = 1
panic = "abort"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fly88oj/rustcrash"
authors = ["RustCrash Team"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.13", features = ["json", "rustls-no-provider", "multipart"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml 0.9 is archived (dtolnay, 2024); yaml_serde is the official
# YAML-org continuation with the identical 0.9 API surface — the package
# rename below keeps every `use serde_yaml::` in the tree source-compatible.
serde_yaml = { package = "yaml_serde", version = "0.10" }

# CLI
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Process & system
# (nix was removed: it was declared here but no crate in the workspace
# ever imported it — std::os::unix covers the previous call sites.)

# Time & scheduling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Compression
flate2 = "1"
base64 = "0.23"
urlencoding = "2"

# Unix-specific
libc = "0.2"

# Hashing (integrity verification)
sha2 = "0.11"

# Testing
tempfile = "3"

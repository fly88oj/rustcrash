name: release-build

# Every push to master runs the full build matrix + tests (so breakage
# is caught long before a release); pushing a v* tag additionally
# publishes a GitHub Release with downloadable per-target artifacts.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - arm-unknown-linux-musleabihf
          - x86_64-unknown-linux-musl
          - mipsel-unknown-linux-musl
          - mips-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      # MIPS targets are Rust tier-3 (no prebuilt std, no cross-rs image):
      # cargo-zigbuild links them with zig, pinned to 0.14.x because
      # 0.13 rejects the musleabi triple and 0.16+ fails the link step.
      - name: Install cargo-zigbuild + zig 0.14 (MIPS only)
        if: matrix.target == 'mipsel-unknown-linux-musl' || matrix.target == 'mips-unknown-linux-musl'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Install zig 0.14 + nightly rust-src (MIPS only)
        if: matrix.target == 'mipsel-unknown-linux-musl' || matrix.target == 'mips-unknown-linux-musl'
        run: |
          pip install ziglang==0.14.1
          rustup toolchain install nightly --profile minimal
          rustup component add rust-src --toolchain nightly
      # The tier-2 targets build via cross-rs/cross:edge in Docker
      # (taiki-e's released cross bundles images too old for this
      # repo's v4 Cargo.lock), exactly as scripts/cross-compile.sh
      # does locally — one source of truth for both.
      - name: Build
        run: bash scripts/cross-compile.sh ${{ matrix.target }}
      - name: Verify ELF
        run: |
          bin="target/cross/${{ matrix.target }}/crash"
          file_output="$(file "$bin")"
          case "${{ matrix.target }}" in
            aarch64-*)       arch="ARM aarch64" ;;
            armv7-*|arm-*)   arch="ARM" ;;
            x86_64-*)        arch="x86-64" ;;
            mipsel-*|mips-*) arch="MIPS" ;;
            *)               echo "unknown target"; exit 1 ;;
          esac
          echo "$file_output"
          [[ "$file_output" == *"$arch"* ]] || { echo "wrong architecture"; exit 1; }
          [[ "$file_output" == *"statically linked"* || "$file_output" == *"static-pie linked"* ]] || { echo "not static"; exit 1; }
      - name: Package
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          DIR="rustcrash-${VERSION}-${{ matrix.target }}"
          mkdir -p "$DIR"
          cp "target/cross/${{ matrix.target }}/crash" "$DIR/crash"
          cp LICENSE "$DIR/" || true
          tar -czf "rustcrash-${VERSION}-${{ matrix.target }}.tar.gz" "$DIR"
          sha256sum "rustcrash-${VERSION}-${{ matrix.target }}.tar.gz" > "SHA256SUMS-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: rustcrash-${{ matrix.target }}
          path: |
            *.tar.gz
            SHA256SUMS-*

  tests:
    name: tests + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Merge checksums
        run: cat dist/SHA256SUMS-* | sort > dist/SHA256SUMS && rm dist/SHA256SUMS-*
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true

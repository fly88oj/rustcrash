# cargo-nextest defaults for this repo (see scripts/run-all-tests.sh).
#
# Why nextest: every test runs in its own process, which removes the
# shared-process interference classes that flake parallel test runs —
# env-var mutations (SSL_CERT_FILE, CRASHDIR, bot tokens), global
# statics, cwd differences — without having to rewrite the tests.

[profile.default]
# Surface slow tests instead of silently absorbing them; the engine has
# legitimate 5-10 s protocol tests, so the bar sits above those.
slow-timeout = { period = "60s", terminate-after = 8 }

# Retries stay OFF everywhere on purpose: a flake means interference or
# a real bug, and retrying would bury the signal this repo's test
# hygiene depends on. Investigate, don't re-roll.
retries = 0

[profile.ci]
# CI mirrors local: no retries, just compact final reporting.
final-status-level = "flaky"
failure-output = "final"

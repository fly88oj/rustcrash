[package]
name = "rustcrash-crash"
version.workspace = true
edition.workspace = true
license.workspace = true

# The single published binary.
[[bin]]
name = "crash"
path = "src/main.rs"

[[test]]
name = "tui_test"
path = "tests/tui_test.rs"

[dev-dependencies]
ratatui-testlib = { version = "0.1", features = ["mvp"] }
# Pinned to 0.8: ratatui-testlib 0.1 hard-depends on portable-pty 0.8 and
# passes its CommandBuilder straight into the harness — a 0.9 bump here is
# a type mismatch until the testlib publishes an update.
portable-pty = "0.8"
tempfile = { workspace = true }

[features]
# Integrated Rust engine editions (mihomo YAML / sing-box JSON dialects).
# Default build keeps the classic external-kernel-only behaviour.
engine-mihomo = ["rustcrash-core/engine-mihomo"]
engine-singbox = ["rustcrash-core/engine-singbox"]
engine-full = ["engine-mihomo", "engine-singbox"]

[dependencies]
rustcrash-core = { path = "../../core" }
anyhow = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
ratatui = "0.30"
crossterm = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
chrono = { workspace = true }

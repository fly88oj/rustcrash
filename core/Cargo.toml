[package]
name = "rustcrash-core"
version.workspace = true
edition = "2021"
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
# Integrated Rust engine (mihomo YAML dialect).
engine-mihomo = ["dep:rustcrash-engine", "rustcrash-engine/mihomo"]
# Integrated Rust engine (sing-box JSON dialect).
engine-singbox = ["dep:rustcrash-engine", "rustcrash-engine/singbox"]

[dependencies]
rustcrash-engine = { path = "../engine", optional = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
flate2 = { workspace = true }
base64 = { workspace = true }
urlencoding = { workspace = true }
regex = "1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
tar = "0.4"
dirs = "7"
# reqwest 0.13 runs rustls without a bundled provider; core installs the
# ring one itself (aws-lc-rs, reqwest's new default, needs cmake for the
# musl cross targets) and pins the bundled webpki roots like 0.12 did.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

[dev-dependencies]
wiremock = "0.6"
